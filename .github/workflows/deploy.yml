name: Build and deploy tigerworkouts.com

# Builds the React app from this repo (base "/"), keeps the v0.9 single-file app at /legacy/ and
# Storybook at /storybook/, and deploys the lot to GitHub Pages. Pull requests build and test
# without deploying, so a broken build is caught before it reaches main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Test and build app and Storybook
        env:
          VITE_BASE: /
        run: |
          npm ci
          npm test
          npm run build
          npm run build-storybook

      - name: Assemble site
        run: |
          mkdir -p _site/legacy
          cp -r dist/. _site/
          cp -r legacy/. _site/legacy/
          rm -rf _site/legacy/supabase _site/legacy/tools _site/legacy/media/src
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          echo "app: $(grep -o '<title>[^<]*' _site/index.html)"
          echo "legacy: $(grep -o '<title>[^<]*' _site/legacy/index.html)"

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
