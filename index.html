<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ee6f3a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<title>Workout Hub — v0.3.4</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --brand: #ee6f3a; --brand-dark: #c1542a; --rest: #1e3a8a; }
  html, body { background: #0f172a; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
  .app { max-width: 430px; margin: 0 auto; min-height: 100dvh; background: #fff; position: relative; display: flex; flex-direction: column; }
  @media (min-width: 480px) { .app { box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.5); } }
  .brand { background: var(--brand); }
  .safe-top { padding-top: calc(env(safe-area-inset-top, 0px) + 14px) !important; }
  .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px) !important; }
  .tabbar { position: sticky; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid #e2e8f0; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 11px; color: #64748b; }
  .tab.active { color: var(--brand); }
  .tab svg { width: 22px; height: 22px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .thumb { width: 84px; height: 56px; border-radius: 10px; object-fit: cover; background: #e2e8f0; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; font-weight: 600; padding: 14px 18px; font-size: 16px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .btn-brand { background: var(--brand); color: #fff; }
  .btn-brand:active { background: var(--brand-dark); }
  .btn-ghost { background: #f1f5f9; color: #0f172a; }
  .btn-ghost:active { background: #e2e8f0; }
  .btn-dark { background: #0f172a; color: #fff; }
  .btn-sm { padding: 9px 14px; font-size: 14px; border-radius: 11px; }
  .stepper { display: inline-flex; align-items: center; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; background: #fff; }
  .stepper button { width: 44px; height: 44px; font-size: 22px; font-weight: 600; color: #0f172a; background: #f8fafc; }
  .stepper button:active { background: #e2e8f0; }
  .stepper .val { min-width: 84px; text-align: center; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .grid-cols-3 .stepper, .grid-cols-2 .stepper { width: 100%; }
  .grid-cols-3 .stepper button { width: 34px; height: 40px; font-size: 18px; flex: none; }
  .grid-cols-3 .stepper .val { min-width: 0; flex: 1; font-size: 15px; }
  .grid-cols-2 .stepper button { width: 38px; height: 42px; flex: none; }
  .grid-cols-2 .stepper .val { min-width: 0; flex: 1; }
  .avatar { width: 36px; height: 36px; border-radius: 999px; background: linear-gradient(135deg,#f59e0b,#ee6f3a); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .exicon { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .exicon svg { width: 22px; height: 22px; }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 40; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 430px; background: #fff; border-radius: 22px 22px 0 0; z-index: 50; max-height: 92dvh; overflow: auto; }
  .sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: #cbd5e1; margin: 10px auto 4px; }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Do mode */
  .run { min-height: 100dvh; display: flex; flex-direction: column; color: #fff; transition: background .35s ease; }
  .run.phase-work { background: var(--brand); }
  .run.phase-rest { background: var(--rest); }
  .run.phase-ready { background: #0f172a; }
  .run.phase-done { background: #065f46; }
  .clock { font-size: 96px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .phase-label { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; opacity: .85; }
  .bar { height: 6px; background: rgba(255,255,255,.25); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: #fff; transition: width .2s linear; }
  .run .stepper { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.12); }
  .run .stepper button { background: rgba(255,255,255,.12); color: #fff; }
  .run .stepper button:active { background: rgba(255,255,255,.3); }
  .run .stepper .val { color: #fff; }
  .run .btn-ghost { background: rgba(255,255,255,.14); color: #fff; }
  .run .btn-ghost:active { background: rgba(255,255,255,.28); }
  .run .btn-brand { background: #fff; color: #0f172a; }
  /* block strip */
  .blocks { display: flex; gap: 4px; }
  .blocks span { flex: 1; height: 8px; border-radius: 6px; background: rgba(255,255,255,.22); }
  .blocks span.done { background: rgba(255,255,255,.6); }
  .blocks span.cur { background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .round-dots { display: flex; gap: 5px; flex-wrap: wrap; }
  .round-dots i { width: 9px; height: 9px; border-radius: 999px; background: rgba(255,255,255,.3); display: block; }
  .round-dots i.on { background: #fff; }
  .round-dots i.cur { background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  /* step strip */
  .steps { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .steps::-webkit-scrollbar { display: none; }
  .step { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.12); opacity: .55; min-width: 0; position: relative; touch-action: pan-x; }
  .step.rest { padding: 8px 9px; }
  .step .exicon { width: 26px; height: 26px; border-radius: 8px; }
  .step .exicon svg { width: 16px; height: 16px; }
  .step .t { font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.1; }
  .step .s { font-size: 10px; opacity: .8; white-space: nowrap; }
  .step.done { opacity: .35; }
  .step.cur { opacity: 1; background: #fff; color: #0f172a; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .step.next { opacity: .9; outline: 2px dashed rgba(255,255,255,.6); }
  .swipe-row { position: relative; overflow: hidden; touch-action: pan-y; }
  .swipe-row .inner { position: relative; z-index: 1; transition: transform .15s ease; }
  .swipe-row .rm { position: absolute; right: 0; top: 0; bottom: 0; width: 84px; display: flex; align-items: center; justify-content: center; background: #ef4444; color: #fff; font-weight: 700; font-size: 13px; z-index: 0; opacity: 0; transition: opacity .15s; }
  .swipe-row.swiping .rm { opacity: 1; }
  .elapsed { font-variant-numeric: tabular-nums; font-size: 12px; opacity: .85; display: inline-flex; align-items: center; gap: 4px; }
  .next-block { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  textarea, input[type=text] { font-size: 16px; }
  .log-pre { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; color: #334155; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: flex; gap: 14px; align-items: center; }
  .toast button { color: #fbbf24; font-weight: 700; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row-tap:active { background: #f8fafc; }
</style>
</head>

<div id="app" class="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
// ───────────────────────── store ─────────────────────────
const LS_KEY = 'workout-hub:v1';
const store = load();
function load() {
  const d = { sessions: [], name: 'Nick', units: 'metric', workouts: [], exercises: {}, favorites: [{ name: 'Game of padel', icon: 'racket', minutes: 60 }], saved: [] };
  try { return Object.assign(d, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); }
  catch { return d; }
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {} if (window.cloud?.user) window.cloud.push(); }

const GH_REPO = 'Holzherr/nick-prototypes';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = n => (Math.round(n * 100) / 100).toString();
const pad = n => String(n).padStart(2, '0');
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.max(0, Math.ceil(s)) % 60)}`;
const fmtDate = iso => new Date(iso).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const ytThumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const allWorkouts = () => [...store.workouts, ...(window.cloud?.remote?.workouts || []), ...WORKOUTS];
const wById = id => allWorkouts().find(w => w.id === id);
const isUserWorkout = w => store.workouts.some(x => x.id === w.id);
const ICON_COLORS = { kettlebell: '#f59e0b', dumbbell: '#a78bfa', treadmill: '#38bdf8', walk: '#34d399', barbell: '#fb7185', body: '#fbbf24', band: '#f472b6', bike: '#22d3ee', rower: '#60a5fa', core: '#c084fc', racket: '#4ade80', run: '#fb923c', swim: '#38bdf8', yoga: '#e879f9', hike: '#a3e635', football: '#facc15' };
const favIcon = f => `<span class="exicon" style="background:${ICON_COLORS[f.icon] || '#94a3b8'};color:#0f172a">${I[f.icon] || I.body}</span>`;
const EX = key => EXERCISES[key] || store.exercises[key] || window.cloud?.remote?.exercises?.[key] || { name: key, unit: 'kg', step: 2.5, icon: 'body', color: ICON_COLORS.body, cue: '', video: '' };
const exLib = () => ({ ...EXERCISES, ...(window.cloud?.remote?.exercises || {}), ...store.exercises });
const exMedia = ex => ex.image || (ex.video ? ytThumb(ex.video) : '');
const shortUnit = u => u.replace(' per arm', '/arm');

function blockMinutes(b) {
  if (b.type === 'interval') return b.rounds * b.exercises.length * (b.work_s + b.rest_s) / 60;
  return b.repeat * b.segments.reduce((a, s) => a + s.s, 0) / 60;
}
function workoutMinutes(w) { return Math.round(w.blocks.reduce((a, b) => a + blockMinutes(b), 0)); }
function blockSummary(b) {
  if (b.type === 'interval') return `${b.rounds} rounds · ${b.work_s}s on / ${b.rest_s}s off`;
  const mins = Math.round(blockMinutes(b));
  return `${mins} min · incline ${b.incline} · ${b.segments.map(s => s.speed).join('/')} kph`;
}
function lastSessionFor(workoutId) {
  return [...store.sessions].reverse().find(s => s.workoutId === workoutId && s.completed);
}
// collapse [17.5,17.5,15] → "17.5 kg ×2, 15 kg ×1"
function runs(arr, unit) {
  if (!arr.length) return '';
  const out = []; let cur = arr[0], n = 0;
  for (const v of arr) { if (v === cur) n++; else { out.push([cur, n]); cur = v; n = 1; } }
  out.push([cur, n]);
  if (out.length === 1) return `${fmtNum(out[0][0])} ${unit}`;
  return out.map(([v, n]) => `${fmtNum(v)} ${unit} ×${n}`).join(', ');
}

  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [seg, id, extra] = h.split('/');
  runner.detach();
  if (seg === 'w' && wById(id)) return renderWorkout(wById(id));
  if (seg === 'w' && id && window.cloud?.client && !window._pulledFor) { window._pulledFor = id; return cloud.sync(); }
  if (seg === 'do' && wById(id)) return renderRun(wById(id));
  if (seg === 's' && store.sessions.find(s => s.id === id)) return renderSummary(store.sessions.find(s => s.id === id), extra === 'edit');
  if (seg === 'me') return renderProfile();
  if (seg === 'new') return renderBuilder(null);
  if (seg === 'edit' && wById(id)) return renderBuilder(wById(id));
  if (seg === 'library') return renderLibrary();
  if (seg === 'import' && id) return importWorkout(id);
  if (seg === 'import-session' && id) return importSession(id);
  return renderDiscover();
}

// ───────────────────────── session model ─────────────────────────
function newSession(w) {
  return {
    id: 's-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    workoutId: w.id, title: w.title, creator: w.creator,
    startedAt: new Date().toISOString(), endedAt: null, duration_min: 0, completed: false, notes: '',
    blocks: w.blocks.map(b => b.type === 'interval'
      ? { name: b.name, type: 'interval', work_s: b.work_s, rest_s: b.rest_s, rounds: b.rounds, rounds_done: 0, rests: [], skipped: false,
          exercises: b.exercises.map(e => ({ ex: e.ex, name: EX(e.ex).name, unit: EX(e.ex).unit, target: e.target, actual: e.target, actuals: [], removed: false,
            ...(EX(e.ex).incline ? { incline: e.incline ?? 0, incline_actual: e.incline ?? 0 } : {}) })) }
      : { name: b.name, type: 'steady', ex: b.ex, minutes: Math.round(blockMinutes(b)), minutes_done: 0, incline: b.incline, skipped: false,
          speeds: b.segments.map(s => s.speed), incline_actual: b.incline, speeds_actual: b.segments.map(s => s.speed) }),
  };
}
function finishSession(s, completed) {
  s.endedAt = new Date().toISOString();
  s.duration_min = Math.max(1, Math.round((new Date(s.endedAt) - new Date(s.startedAt)) / 60000));
  s.completed = completed;
  if (!store.sessions.find(x => x.id === s.id)) store.sessions.push(s);
  save();
}
function logWithoutTimer(id) {
  const w = wById(id);
  const s = newSession(w);
  s.blocks.forEach(b => { if (b.type === 'interval') b.rounds_done = b.rounds; else b.minutes_done = b.minutes; });
  s.endedAt = s.startedAt;
  s.duration_min = workoutMinutes(w);
  s.completed = true;
  store.sessions.push(s); save();
  go(`s/${s.id}/edit`);
}

// ───────────────────────── log text + export ─────────────────────────
function exLine(e) {
  if (e.removed) return `${e.name}: dropped`;
  const val = e.actuals?.length ? runs(e.actuals, e.unit) : `${fmtNum(e.actual)} ${e.unit}`;
  const tgt = (e.actuals?.length ? e.actuals.some(a => a !== e.target) : e.actual !== e.target) ? ` (target ${fmtNum(e.target)})` : '';
  const inc = e.incline_actual != null && e.incline_actual > 0 ? ` · incline ${fmtNum(e.incline_actual)}` : '';
  return `${e.name}: ${val}${tgt}${inc}`;
}
function restLine(b) {
  if (!b.rests?.length) return '';
  const avg = b.rests.reduce((a, x) => a + x, 0) / b.rests.length;
  if (Math.abs(avg - b.rest_s) < 3) return '';
  return ` · rest ~${Math.round(avg)}s of ${b.rest_s}s`;
}
function sessionText(s) {
  const lines = [];
  if (s.type === 'activity') {
    lines.push(`${s.title} — activity`);
    lines.push(`${fmtDate(s.startedAt)} ${fmtTime(s.startedAt)}–${fmtTime(s.endedAt)} · ${s.duration_min} min · ${s.intensity}`);
    if (s.notes) lines.push(`Notes: ${s.notes}`);
    return lines.join('\n');
  }
  lines.push(`${s.title} — by ${s.creator}`);
  lines.push(`${fmtDate(s.startedAt)} ${fmtTime(s.startedAt)}${s.endedAt ? '–' + fmtTime(s.endedAt) : ''} · ${s.duration_min} min${s.completed ? '' : ' · stopped early'}`);
  lines.push('');
  s.blocks.forEach((b, i) => {
    if (b.type === 'interval') {
      lines.push(`${i + 1}. ${b.name} — ${b.rounds_done}/${b.rounds} rounds · ${b.work_s}s on / ${b.rest_s}s off${restLine(b)}${b.skipped ? ' · skipped' : ''}`);
      b.exercises.forEach(e => lines.push(`   ${exLine(e)}`));
    } else {
      lines.push(`${i + 1}. ${b.name} — ${b.minutes_done}/${b.minutes} min · incline ${fmtNum(b.incline_actual)} · ${b.speeds_actual.map(fmtNum).join('/')} kph${b.skipped ? ' · skipped' : ''}`);
    }
  });
  if (s.notes) { lines.push(''); lines.push(`Notes: ${s.notes}`); }
  return lines.join('\n');
}
function sessionJSON(s) { return JSON.stringify(s); }
function githubIssueUrl(s) {
  const title = `[workout-log] ${fmtDate(s.startedAt)} — ${s.title}`;
  const body = `${sessionText(s)}\n\n<details><summary>json</summary>\n\n\`\`\`json\n${sessionJSON(s)}\n\`\`\`\n</details>`;
  return `https://github.com/${GH_REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch { toast('Copy failed — long-press the text'); }
    ta.remove();
  }
}
async function shareText(s) {
  const text = sessionText(s) + '\n\n' + sessionJSON(s);
  if (navigator.share) { try { await navigator.share({ title: s.title, text }); } catch {} }
  else copyText(text);
}
let toastT;
function toast(msg, action, onAction) {
  $('#toast')?.remove();
  const t = document.createElement('div'); t.id = 'toast'; t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { onAction(); t.remove(); };
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), action ? 4000 : 1800);
}

// ───────────────────────── summary / edit ─────────────────────────
function renderSummary(s, edit) {
  if (s.type === 'activity') return renderActivitySummary(s);
  if (edit) return renderSessionEdit(s);
  const blocks = s.blocks.map((b, bi) => {
    if (b.type === 'interval') {
      return `
      <div class="card px-4 py-3">
        <div class="flex items-center justify-between mb-2">
          <div class="font-semibold text-slate-900">${bi + 1}. ${esc(b.name)}</div>
          ${edit ? stepper(`s.blocks[${bi}].rounds_done`, b.rounds_done, 1, 'rounds', 0, b.rounds)
                 : `<div class="text-[13px] text-slate-500">${b.rounds_done}/${b.rounds} rounds${restLine(b)}</div>`}
        </div>
        <div class="space-y-2">${b.exercises.map((e, ei) => `
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 min-w-0">${exIcon(e.ex)}<div class="text-[14px] text-slate-700 leading-tight">${esc(e.name)}<div class="text-slate-400 text-[12px]">target ${fmtNum(e.target)}${e.removed ? ' · dropped' : ''}</div></div></div>
            ${edit ? stepper(`s.blocks[${bi}].exercises[${ei}].actual`, e.actual, EX(e.ex).step, e.unit)
                   : `<div class="font-semibold text-slate-900 text-[15px] text-right">${e.removed ? '<span class="text-slate-400 font-normal">—</span>' : e.actuals?.length && new Set(e.actuals).size > 1 ? `<span class="text-[13px]">${esc(runs(e.actuals, shortUnit(e.unit)))}</span>` : `${fmtNum(e.actual)} <span class="text-[12px] text-slate-500 font-normal">${esc(e.unit)}</span>`}${e.incline_actual > 0 ? `<div class="text-[11px] text-slate-500 font-normal">incline ${fmtNum(e.incline_actual)}</div>` : ''}</div>`}
          </div>
          ${edit && e.incline_actual != null ? `<div class="flex items-center justify-between gap-3 pl-11"><div class="text-[13px] text-slate-500">Incline</div>${stepper(`s.blocks[${bi}].exercises[${ei}].incline_actual`, e.incline_actual, 1, '')}</div>` : ''}`).join('')}</div>
      </div>`;
    }
    return `
      <div class="card px-4 py-3">
        <div class="flex items-center justify-between mb-2">
          <div class="font-semibold text-slate-900">${bi + 1}. ${esc(b.name)}</div>
          ${edit ? stepper(`s.blocks[${bi}].minutes_done`, b.minutes_done, 1, 'min', 0)
                 : `<div class="text-[13px] text-slate-500">${b.minutes_done}/${b.minutes} min</div>`}
        </div>
        <div class="flex items-center justify-between gap-3">
          <div class="text-[14px] text-slate-700">Incline</div>
          ${edit ? stepper(`s.blocks[${bi}].incline_actual`, b.incline_actual, 1, '')
                 : `<div class="font-semibold text-slate-900">${fmtNum(b.incline_actual)}</div>`}
        </div>
        ${b.speeds_actual.map((sp, si) => `
        <div class="flex items-center justify-between gap-3 mt-2">
          <div class="text-[14px] text-slate-700">Segment ${si + 1} speed</div>
          ${edit ? stepper(`s.blocks[${bi}].speeds_actual[${si}]`, sp, 0.5, 'kph')
                 : `<div class="font-semibold text-slate-900">${fmtNum(sp)} <span class="text-[12px] text-slate-500 font-normal">kph</span></div>`}
        </div>`).join('')}
      </div>`;
  }).join('');
  window._s = s;
  shell(`
    <header class="safe-top px-4 pb-3 pt-3 ${s.completed ? 'bg-emerald-600' : 'bg-slate-700'} text-white">
      <a href="#/me" class="inline-flex items-center gap-1 text-white/90 text-[14px] mb-2">${I.back}Profile</a>
      <div class="text-[11px] uppercase tracking-widest opacity-80 font-semibold">${s.completed ? 'Workout complete' : 'Stopped early'}</div>
      <h1 class="text-[22px] font-bold leading-tight">${esc(s.title)}</h1>

    </header>
    <div class="px-4 py-4 space-y-3 pb-8">
      ${blocks}
      <div class="card px-4 py-3">
        <div class="text-[12px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Notes</div>
        ${edit ? `<textarea class="w-full border border-slate-200 rounded-xl p-3 text-[15px]" rows="3" placeholder="How did it feel? Anything to change next time?" oninput="_s.notes=this.value">${esc(s.notes)}</textarea>`
               : `<div class="text-[14px] text-slate-700">${esc(s.notes) || '<span class="text-slate-400">—</span>'}</div>`}

  if (!edit) {
    const el = $('#device-card');
    // readings saved with the session itself (treadmill display, Fitbit screenshot, Echo-filed data)
    if (el && s.device) el.innerHTML = (Array.isArray(s.device) ? s.device : [s.device]).map(d => deviceCard(d, d.source || 'Device')).join('');
    // watch data matched by rough time (±60 min, closest first) from the cloud
    if (window.cloud?.user) cloud.deviceFor(s).then(rows => {
      if (!el || !rows.length) return;
      el.innerHTML += rows.map(r => deviceCard(r.data, `From Fitbit · ${fmtTime(r.started_at)}`)).join('');
    }).catch(() => {});
  }
}
// ───────────────────────── session edit ─────────────────────────
// Full edit of a logged session: when, how long, what was done per block/exercise/round.

  window._s = s;
  const localTime = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  const rowBtn = (label, fn, danger) => `<button class="chip ${danger ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-600'}" style="padding:6px 10px" onclick="${fn}">${label}</button>`;
  const blocks = s.blocks.map((b, bi) => {
    const head = `

      </div>`;
    if (b.type === 'interval') {
      return `
      <div class="card px-4 py-3 ${b.skipped ? 'opacity-60' : ''}">

          <div><div class="text-[11px] text-slate-500 mb-1">Rounds done</div>${stepper(`s.blocks[${bi}].rounds_done`, b.rounds_done, 1, `/${b.rounds}`, 0, 50)}</div>

            ${e.incline_actual != null ? `<div class="flex items-center justify-between gap-3 mt-2 pl-11"><div class="text-[13px] text-slate-500">Incline</div>${stepper(`s.blocks[${bi}].exercises[${ei}].incline_actual`, e.incline_actual, 1, '')}</div>` : ''}

        </div>

        ${b.speeds_actual.map((sp, si) => `

          <div class="text-[14px] text-slate-700">Segment ${si + 1} speed</div>
          <div class="flex items-center gap-1">${stepper(`s.blocks[${bi}].speeds_actual[${si}]`, sp, 0.5, 'kph', 0, 40)}${b.speeds_actual.length > 1 ? `<button class="text-slate-400 p-1" onclick="_s.blocks[${bi}].speeds_actual.splice(${si},1); sEdit()">${I.x}</button>` : ''}</div>

        <button class="btn btn-ghost btn-sm w-full mt-3" onclick="_s.blocks[${bi}].speeds_actual.push(_s.blocks[${bi}].speeds_actual.at(-1) ?? 6); sEdit()">${I.plus}Add segment</button>

  }).join('');
  shell(`
    <header class="safe-top px-4 pb-3 pt-3 bg-slate-900 text-white">

function sEdit() { renderSessionEdit(window._s); }
function sSave() {
  const s = window._s;
  s.endedAt = new Date(new Date(s.startedAt).getTime() + s.duration_min * 60000).toISOString();
  s.blocks.forEach(b => { if (b.type === 'interval') b.exercises.forEach(e => { if (e.actuals?.length && new Set(e.actuals).size === 1) e.actual = e.actuals[0]; }); });
  save(); go(`s/${s.id}`);
}
function stepper(path, val, step, unit, min = 0, max = 999) {
  return `<div class="stepper">
    <button onclick="stepVal('${path}', ${-step}, ${min}, ${max}, this)">−</button>
    <div class="val">${fmtNum(val)}${unit ? `<span class="text-[11px] font-medium text-slate-500"> ${esc(shortUnit(unit))}</span>` : ''}</div>
    <button onclick="stepVal('${path}', ${step}, ${min}, ${max}, this)">+</button>
  </div>`;
}
function stepVal(path, delta, min, max, btn) {
  const p = path.replace(/^s\./, '').replace(/\[(\d+)\]/g, '.$1').split('.');
  let o = window._s; for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  const k = p[p.length - 1];
  o[k] = Math.min(max, Math.max(min, Math.round((o[k] + delta) * 100) / 100));
  const v = btn.parentElement.querySelector('.val'); const u = v.querySelector('span');
  v.innerHTML = fmtNum(o[k]) + (u ? u.outerHTML : '');
}
function deleteSession(id) {
  if (!confirm('Delete this session?')) return;
  store.sessions = store.sessions.filter(s => s.id !== id); save(); go('me');
}

// ───────────────────────── profile ─────────────────────────

    <a href="#/s/${s.id}" class="card block px-4 py-3 row-tap">

    </a>`).join('') : `<div class="card px-4 py-8 text-center text-slate-400 text-[14px]">No sessions yet. Pick a workout in Discover.</div>`;

    <header class="safe-top px-5 pb-4 pt-4">

      </div>
      <div class="grid grid-cols-3 gap-2 mt-4">

const stat = (v, l) => `<div class="card px-3 py-2.5 text-center"><div class="text-[22px] font-bold text-slate-900 leading-none">${v}</div><div class="text-[11px] text-slate-500 mt-1">${l}</div></div>`;

// ───────────────────────── runner (do mode) ─────────────────────────
const runner = {
  s: null, w: null, bi: 0, ri: 0, ei: 0, si: 0, // block, round, exercise, segment
  phase: 'ready', endsAt: 0, remaining: 0, paused: false, timer: null, wake: null, lastBeep: null, active: false, startedMs: 0,

  start(w) {
    this.w = w; this.s = newSession(w); this.bi = 0; this.active = true; this.startedMs = Date.now();
    this.readyBlock();
    this.timer = setInterval(() => this.tick(), 200);
    document.addEventListener('visibilitychange', this.onVis = () => { if (!document.hidden) this.tick(); });
    this.requestWake();
  },
  detach() {
    if (!this.active) return;
    clearInterval(this.timer); this.timer = null;
    document.removeEventListener('visibilitychange', this.onVis);
    this.wake?.release?.(); this.wake = null; this.active = false;
  },
  async requestWake() { try { this.wake = await navigator.wakeLock?.request('screen'); } catch {} },
  block() { return this.w.blocks[this.bi]; },
  blockLog() { return this.s.blocks[this.bi]; },
  activeIdx() { return this.blockLog().exercises.map((e, i) => e.removed ? -1 : i).filter(i => i >= 0); },
  nextActive(from) { const a = this.activeIdx(); return a.find(i => i > from); },
  isLastEx() { const a = this.activeIdx(); return this.ei === a[a.length - 1]; },
  elapsed() { return (Date.now() - this.startedMs) / 1000; },

  readyBlock() { this.ri = 0; this.ei = 0; this.si = 0; this.phase = 'ready'; this.paused = false; this.draw(); },
  beginBlock() {
    if (this.block().type === 'interval') {
      const a = this.activeIdx();
      if (!a.length) return this.finishBlock();
      this.ei = a[0];
    }
    this.setPhase('lead', 5);
  },
  setPhase(phase, secs) {
    this.phase = phase; this.remaining = secs; this.endsAt = Date.now() + secs * 1000; this.paused = false; this.lastBeep = null;
    if (phase === 'work') {
      beep(880, .18); vib([120]);
      const b = this.block();
      if (b.type === 'interval') { const e = this.blockLog().exercises[this.ei]; e.actuals[this.ri] = e.actual; }
    }
    if (phase === 'rest') { beep(440, .25); vib([60, 60, 60]); }
    this.draw();
  },
  tick() {
    const el = $('#elapsed'); if (el) el.textContent = mmss(this.elapsed());
    if (this.paused || !['lead', 'work', 'rest'].includes(this.phase)) return;
    const left = (this.endsAt - Date.now()) / 1000;
    this.remaining = Math.max(0, left);
    const c = Math.ceil(left);
    if (c <= 3 && c >= 1 && this.lastBeep !== c) { this.lastBeep = c; beep(660, .08); }
    if (left <= 0) this.advance(); else this.drawClock();
  },
  advance() {
    const b = this.block(), log = this.blockLog();
    if (b.type === 'interval') {
      if (this.phase === 'lead') return this.setPhase('work', b.work_s);
      if (this.phase === 'work') {
        const lastEx = this.isLastEx();
        const lastRound = this.ri === b.rounds - 1;
        if (lastEx) log.rounds_done = this.ri + 1;
        if (lastEx && lastRound) return this.finishBlock();
        return this.setPhase('rest', b.rest_s);
      }
      if (this.phase === 'rest') {
        log.rests.push(Math.round(b.rest_s - this.remaining));
        const nx = this.nextActive(this.ei);
        if (nx == null) { this.ei = this.activeIdx()[0]; this.ri++; } else this.ei = nx;
        return this.setPhase('work', b.work_s);
      }
    } else {
      const segs = b.segments;
      if (this.phase === 'lead') return this.setPhase('work', segs[0].s);
      const totalSegs = segs.length * b.repeat;
      const done = this.si + 1;
      let secs = 0; for (let i = 0; i < done; i++) secs += segs[i % segs.length].s;
      log.minutes_done = Math.round(secs / 60);
      if (done >= totalSegs) return this.finishBlock();
      this.si = done;
      return this.setPhase('work', segs[this.si % segs.length].s);
    }
  },
  finishBlock() {
    beep(1046, .35); vib([200, 80, 200]);
    if (this.bi < this.w.blocks.length - 1) { this.bi++; this.readyBlock(); }
    else { this.phase = 'done'; this.draw(); }
  },
  skipBlock() { this.blockLog().skipped = true; this.finishBlock(); },
  skip() { if (['lead', 'work', 'rest'].includes(this.phase)) this.advance(); },
  togglePause() {
    if (this.paused) { this.endsAt = Date.now() + this.remaining * 1000; this.paused = false; }
    else { this.remaining = Math.max(0, (this.endsAt - Date.now()) / 1000); this.paused = true; }
    this.draw();
  },
  endBlock() {
    const b = this.block(), log = this.blockLog();
    if (b.type === 'interval') log.rounds_done = Math.min(b.rounds, this.ri + (this.phase === 'rest' && this.isLastEx() ? 1 : 0));
    else {
      const segs = b.segments, per = segs.reduce((a, x) => a + x.s, 0);
      const elapsedInSeg = this.phase === 'work' ? segs[this.si % segs.length].s - this.remaining : 0;
      log.minutes_done = Math.round((Math.floor(this.si / segs.length) * per + segs.slice(0, this.si % segs.length).reduce((a, x) => a + x.s, 0) + elapsedInSeg) / 60);
    }
    this.finishBlock();
  },
  finishAll() {
    const completed = this.phase === 'done';
    finishSession(this.s, completed);
    const id = this.s.id; this.detach(); go(`s/${id}`);
  },
  adjust(ei, delta) {
    const e = this.blockLog().exercises[ei];
    e.actual = Math.max(0, Math.round((e.actual + delta) * 100) / 100);
    if (this.phase === 'work' && ei === this.ei) e.actuals[this.ri] = e.actual;
    const el = $(`#act-${ei}`); if (el) el.textContent = fmtNum(e.actual);
  },
  adjustIncline(ei, delta) {
    const e = this.blockLog().exercises[ei];
    e.incline_actual = Math.max(0, Math.round((e.incline_actual + delta) * 10) / 10);
    const el = $(`#inc-${ei}`); if (el) el.textContent = fmtNum(e.incline_actual);
  },
  adjustSteady(field, idx, delta) {
    const log = this.blockLog();
    if (field === 'incline') log.incline_actual = Math.max(0, log.incline_actual + delta);
    else log.speeds_actual[idx] = Math.max(0, Math.round((log.speeds_actual[idx] + delta) * 100) / 100);
    this.draw();
  },
  removeEx(ei) {
    const log = this.blockLog(), e = log.exercises[ei];
    if (this.activeIdx().length <= 1) { toast('Last step — use Skip block instead'); return; }
    e.removed = true;
    toast(`Dropped ${e.name}`, 'Undo', () => { e.removed = false; this.draw(); });
    if (this.phase !== 'ready' && ei === this.ei) {
      // currently on this step: move on as if it ended
      if (this.phase === 'work') { const b = this.block(); const lastRound = this.ri === b.rounds - 1; if (this.nextActive(ei) == null) { log.rounds_done = this.ri + 1; if (lastRound) return this.finishBlock(); } this.ei = ei; return this.setPhase('rest', b.rest_s); }
      if (this.phase === 'rest' || this.phase === 'lead') { const nx = this.nextActive(ei) ?? this.activeIdx()[0]; if (this.nextActive(ei) == null && this.phase === 'rest') this.ri++; this.ei = nx; return this.setPhase('work', this.block().work_s); }
    }
    this.draw();
  },

  drawClock() {
    const c = $('#clock'); if (c) c.textContent = mmss(this.remaining);
    const bar = $('#bar'); if (bar) { const total = this.phaseTotal(); bar.style.width = `${100 * (1 - this.remaining / total)}%`; }
  },
  phaseTotal() {
    const b = this.block();
    if (this.phase === 'lead') return 5;
    if (b.type === 'interval') return this.phase === 'work' ? b.work_s : b.rest_s;
    return b.segments[this.si % b.segments.length].s;
  },
  header(sub) {
    const w = this.w;
    return `
      <div class="safe-top px-4 pt-3">
        <div class="flex items-center justify-between">
          <div class="text-[12px] font-semibold opacity-80 truncate">${esc(w.title)}</div>
          <div class="flex items-center gap-3">
            <span class="elapsed">${I.clock}<span id="elapsed">${mmss(this.elapsed())}</span></span>
            <button class="p-1 opacity-80" onclick="runner.exit()" aria-label="Exit">${I.x}</button>
          </div>
        </div>
        <div class="blocks mt-2">${w.blocks.map((b, i) => `<span class="${i < this.bi ? 'done' : i === this.bi ? 'cur' : ''}"></span>`).join('')}</div>
        <div class="flex items-baseline justify-between mt-1.5">
          <div class="text-[12px] opacity-80">Block ${this.bi + 1} of ${w.blocks.length}</div>
          ${sub || ''}
        </div>
      </div>`;
  },
  stepStrip() {
    const b = this.block(), log = this.blockLog();
    const a = this.activeIdx();
    const curPos = a.indexOf(this.ei);
    const items = [];
    a.forEach((ei, pos) => {
      const e = log.exercises[ei];
      const isCur = pos === curPos && (this.phase === 'work' || this.phase === 'lead');
      const isDone = pos < curPos || (pos === curPos && this.phase === 'rest');
      const isNext = this.phase === 'rest' && pos === curPos + 1;
      items.push(`<div class="step ${isCur ? 'cur' : isDone ? 'done' : isNext ? 'next' : ''}" data-ei="${ei}" data-swipe>${exIcon(e.ex)}<div><div class="t">${esc(e.name)}</div><div class="s">${b.work_s}s · ${fmtNum(e.actual)} ${esc(shortUnit(e.unit))}</div></div></div>`);
      const restCur = pos === curPos && this.phase === 'rest';
      const restDone = pos < curPos;
      const restNext = pos === curPos && this.phase === 'work';
      const lastRestOfBlock = pos === a.length - 1 && this.ri === b.rounds - 1;
      if (!lastRestOfBlock) items.push(`<div class="step rest ${restCur ? 'cur' : restDone ? 'done' : restNext ? 'next' : ''}"><span class="exicon" style="background:rgba(255,255,255,.25);color:currentColor">${I.rest}</span><div><div class="t">Rest</div><div class="s">${b.rest_s}s</div></div></div>`);
    });
    return `<div class="steps mt-3" id="steps">${items.join('')}</div>`;
  },
  draw() {
    const b = this.block(), log = this.blockLog(), w = this.w;
    const bg = this.phase === 'work' ? 'phase-work' : this.phase === 'rest' ? 'phase-rest' : this.phase === 'done' ? 'phase-done' : 'phase-ready';
    const nextBlock = w.blocks[this.bi + 1];
    let body;
    if (this.phase === 'done') {
      body = `
        <div class="flex-1 flex flex-col items-center justify-center text-center px-6">
          <div class="text-[64px] mb-2">🏁</div>
          <div class="text-[26px] font-bold">Workout complete</div>
          <div class="opacity-80 mt-1">${Math.round(this.elapsed() / 60)} min · ${w.blocks.length} blocks</div>
        </div>
        <div class="px-5 pb-8 safe-bottom"><button class="btn btn-brand w-full" onclick="runner.finishAll()">${I.check}Review &amp; save log</button></div>`;
    } else if (this.phase === 'ready') {
      const rows = b.type === 'interval'
        ? log.exercises.map((e, ei) => `
          <div class="swipe-row ${e.removed ? 'opacity-40' : ''}" data-ei="${ei}" ${e.removed ? '' : 'data-swipe'}>
            <div class="rm">Drop</div>
            <div class="inner flex items-center gap-3 py-2.5" style="background:#0f172a">
              ${exIcon(e.ex)}
              <div class="flex-1 min-w-0" onclick="openVideo('${e.ex}')"><div class="font-semibold text-[15px]">${esc(e.name)}${e.removed ? ' <span class="text-[11px] opacity-70">dropped</span>' : ''}</div><div class="text-[12px] opacity-75 truncate">${esc(EX(e.ex).cue)}</div></div>
              ${e.removed ? `<button class="btn btn-ghost btn-sm" onclick="runner.blockLog().exercises[${ei}].removed=false; runner.draw()">Undo</button>` : `
              <div class="stepper"><button onclick="runner.adjust(${ei}, ${-EX(e.ex).step})">−</button><div class="val"><span id="act-${ei}">${fmtNum(e.actual)}</span> <span class="text-[11px] opacity-70">${esc(shortUnit(e.unit))}</span></div><button onclick="runner.adjust(${ei}, ${EX(e.ex).step})">+</button></div>`}
            </div>
          </div>`).join('')
        : `<div class="flex items-center gap-3 py-2">
            ${exIcon(b.ex)}
            <div class="flex-1 min-w-0" onclick="openVideo('${b.ex}')"><div class="font-semibold text-[15px]">${esc(EX(b.ex).name)}</div><div class="text-[12px] opacity-75">${b.repeat} × (${b.segments.map(s => `${s.s / 60} min @ ${s.speed} kph`).join(' + ')}) · incline ${b.incline}</div></div>
            <img class="thumb" style="width:64px;height:42px" src="${ytThumb(EX(b.ex).video)}" alt="">
          </div>`;
      body = `
        ${this.header()}
        <div class="flex-1 px-5 pt-4">
          <div class="phase-label">${this.bi === 0 ? 'First block' : 'Next block'}</div>
          <div class="text-[28px] font-bold leading-tight mt-1">${esc(b.name)}</div>
          <div class="opacity-80 text-[14px] mt-1">${blockSummary(b)}</div>
          <div class="mt-4 divide-y divide-white/10">${rows}</div>
          ${b.type === 'interval' ? `<div class="text-[11px] opacity-60 mt-2">Swipe a step left to drop it from this block. Tap the name for the demo.</div>` : ''}
          ${nextBlock ? `<div class="next-block mt-5"><span class="opacity-70">After this:</span> <b>${esc(nextBlock.name)}</b> <span class="opacity-70">· ${blockSummary(nextBlock)}</span></div>` : `<div class="next-block mt-5 opacity-80">Last block.</div>`}
        </div>
        <div class="px-5 pb-8 safe-bottom flex gap-2">
          <button class="btn btn-brand flex-1" onclick="runner.beginBlock()">${I.play}Start block</button>
          <button class="btn btn-ghost" onclick="runner.skipBlock()">Skip block</button>
        </div>`;
    } else {
      // lead / work / rest
      const isInterval = b.type === 'interval';
      const curEx = isInterval ? log.exercises[this.ei] : null;

      const nextEi = isInterval ? (nx == null ? this.activeIdx()[0] : nx) : null;
      const nextEx = isInterval ? log.exercises[nextEi] : null;
      const label = this.phase === 'lead' ? 'Get ready' : this.phase === 'work' ? (isInterval ? 'Work' : 'Go') : 'Rest';
      const seg = !isInterval ? b.segments[this.si % b.segments.length] : null;

      const roundInfo = isInterval ? `Round ${this.ri + 1} of ${b.rounds}` : `Segment ${this.si + 1} of ${b.segments.length * b.repeat}`;
      const focusEi = isInterval ? (this.phase === 'rest' ? nextEi : this.ei) : null;
      const focusEx = isInterval ? log.exercises[focusEi] : null;
      const focus = isInterval
        ? `<div class="flex items-center gap-3">
             ${exIcon(focusEx.ex)}
             <div class="min-w-0"><div class="text-[12px] opacity-75">${this.phase === 'rest' ? (nx == null ? 'Next round starts with' : 'Next') : this.phase === 'lead' ? 'First up' : 'Now'}</div>
             <div class="text-[24px] font-bold leading-tight">${esc(focusEx.name)}</div></div>
           </div>`
        : `<div class="flex items-center gap-3">${exIcon(b.ex)}<div><div class="text-[12px] opacity-75">${this.phase === 'lead' ? 'First segment' : 'Now'}</div><div class="text-[24px] font-bold leading-tight">${fmtNum(log.speeds_actual[this.si % b.segments.length])} kph · incline ${fmtNum(log.incline_actual)}</div><div class="text-[13px] opacity-90">${esc(EX(b.ex).name)} · ${seg.s / 60} min</div></div></div>`;
      const adjust = isInterval ? `
          <div class="flex items-center justify-between mt-3">
            <div class="text-[13px] opacity-80">${this.phase === 'rest' ? 'Next set with' : 'Using'}</div>
            <div class="stepper"><button onclick="runner.adjust(${focusEi}, ${-EX(focusEx.ex).step})">−</button><div class="val"><span id="act-${focusEi}">${fmtNum(focusEx.actual)}</span> <span class="text-[11px] opacity-70">${esc(shortUnit(focusEx.unit))}</span></div><button onclick="runner.adjust(${focusEi}, ${EX(focusEx.ex).step})">+</button></div>
          </div>
          ${focusEx.incline_actual != null ? `
          <div class="flex items-center justify-between mt-2">
            <div class="text-[13px] opacity-80 inline-flex items-center gap-1">${I.slope}Incline</div>
            <div class="stepper"><button onclick="runner.adjustIncline(${focusEi}, -1)">−</button><div class="val"><span id="inc-${focusEi}">${fmtNum(focusEx.incline_actual)}</span></div><button onclick="runner.adjustIncline(${focusEi}, 1)">+</button></div>
          </div>` : ''}`
        : `<div class="flex items-center justify-between mt-3">
            <div class="text-[13px] opacity-80">Speed</div>
            <div class="stepper"><button onclick="runner.adjustSteady('speed', ${this.si % b.segments.length}, -0.5)">−</button><div class="val">${fmtNum(log.speeds_actual[this.si % b.segments.length])} <span class="text-[11px] opacity-70">kph</span></div><button onclick="runner.adjustSteady('speed', ${this.si % b.segments.length}, 0.5)">+</button></div>
          </div>
          <div class="flex items-center justify-between mt-2">
            <div class="text-[13px] opacity-80 inline-flex items-center gap-1">${I.slope}Incline</div>
            <div class="stepper"><button onclick="runner.adjustSteady('incline', 0, -1)">−</button><div class="val">${fmtNum(log.incline_actual)}</div><button onclick="runner.adjustSteady('incline', 0, 1)">+</button></div>
          </div>`;
      const videoKey = isInterval ? focusEx.ex : b.ex;
      const nextBlockNote = isInterval && lastRound && nextBlock && (this.phase === 'rest' || this.isLastEx())
        ? `<div class="next-block mt-3"><span class="opacity-70">Next block:</span> <b>${esc(nextBlock.name)}</b></div>` : '';
      body = `
        ${this.header(`<div class="text-[13px] font-semibold">${esc(b.name)} · ${roundInfo}</div>`)}
        <div class="px-4">
          ${isInterval ? `<div class="round-dots mt-2">${Array.from({ length: b.rounds }, (_, i) => `<i class="${i < this.ri ? 'on' : i === this.ri ? 'cur' : ''}"></i>`).join('')}</div>` : ''}
          ${isInterval ? this.stepStrip() : ''}

// swipe-left-to-drop on [data-swipe] elements (ready rows + step strip chips)
function attachSwipes() {
  $$('[data-swipe]').forEach(el => {
    let x0 = null, dx = 0, y0 = 0, cancelled = false;
    const inner = el.querySelector('.inner') || el;
    el.addEventListener('touchstart', ev => { x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dx = 0; cancelled = false; inner.style.transition = 'none'; }, { passive: true });
    el.addEventListener('touchmove', ev => { if (x0 != null && ev.touches[0].clientX - x0 < -12) el.classList.add('swiping'); }, { passive: true });
    el.addEventListener('touchmove', ev => {
      if (x0 == null || cancelled) return;
      dx = ev.touches[0].clientX - x0;
      if (Math.abs(ev.touches[0].clientY - y0) > 30 && Math.abs(dx) < 20) { cancelled = true; inner.style.transform = ''; return; }
      if (dx < 0) inner.style.transform = `translateX(${Math.max(dx, -110)}px)`;
    }, { passive: true });
    el.addEventListener('touchend', () => {
      inner.style.transition = '';
      if (!cancelled && dx < -70) runner.removeEx(+el.dataset.ei); else { inner.style.transform = ''; el.classList.remove('swiping'); }
      x0 = null;
    });
  });
}

function importSession(payload) {

      <div class="px-4 pb-4 space-y-3">

        <div class="flex flex-wrap gap-2" id="fv-icons">${icons.map((k, i) => `<button class="exicon" data-k="${k}" style="width:44px;height:44px;background:${ICON_COLORS[k]};color:#0f172a;outline:${i === 0 ? '3px solid #0f172a' : 'none'}" onclick="$$('#fv-icons .exicon').forEach(b=>b.style.outline='none'); this.style.outline='3px solid #0f172a'; window._fvIcon='${k}'">${I[k]}</button>`).join('')}</div>
        <div class="flex items-center justify-between"><div class="text-[14px] text-slate-700">Usual duration</div><div class="stepper"><button onclick="_fvMin=Math.max(5,_fvMin-5); $('#fv-min').textContent=_fvMin">−</button><div class="val"><span id="fv-min">60</span><span class="text-[11px] font-medium text-slate-500"> min</span></div><button onclick="_fvMin+=5; $('#fv-min').textContent=_fvMin">+</button></div></div>
        <button class="btn btn-brand w-full" onclick="saveFavorite()">${I.check}Add favourite</button>
      </div>
    </div>`;
  window._fvIcon = 'racket'; window._fvMin = 60;
  document.body.appendChild(el);
  setTimeout(() => $('#fv-name')?.focus(), 50);
}
function saveFavorite() {
  const name = $('#fv-name').value.trim(); if (!name) return toast('Name it first');
  store.favorites.push({ name, icon: window._fvIcon, minutes: window._fvMin }); save(); closeSheet(); renderDiscover(); toast(`Added ${name}`);
}
function manageFavorites() {
  closeSheet();
  const el = document.createElement('div'); el.id = 'sheet';
  el.innerHTML = `
    <div class="sheet-backdrop" onclick="closeSheet()"></div>
    <div class="sheet safe-bottom">
      <div class="sheet-handle"></div>
      <div class="px-4 pb-2 flex items-center justify-between"><div class="font-semibold text-slate-900 text-[17px]">Favourites</div><button class="text-slate-400 p-1" onclick="closeSheet()">${I.x}</button></div>
      <div class="px-4 pb-4 space-y-2">
        ${store.favorites.map((f, i) => `<div class="flex items-center gap-3 py-1">${favIcon(f)}<div class="flex-1 text-[15px] text-slate-900">${esc(f.name)}<div class="text-[12px] text-slate-500">${f.minutes} min · logged ${store.sessions.filter(s => s.type === 'activity' && s.title === f.name).length}×</div></div><button class="text-red-500 p-1" onclick="store.favorites.splice(${i},1); save(); closeSheet(); renderDiscover()">${I.trash}</button></div>`).join('') || '<div class="text-slate-400 text-[14px] py-4 text-center">No favourites yet.</div>'}
        <button class="btn btn-ghost w-full" onclick="addFavorite()">${I.plus}Add favourite</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

// ───────────────────────── library ─────────────────────────
function renderLibrary() {
  const lib = exLib();
  const usedBy = k => allWorkouts().filter(w => wExKeys(w).includes(k)).length;
  const rows = Object.entries(lib).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([k, ex]) => `
    <button class="w-full text-left card flex items-center gap-3 px-3 py-2.5 row-tap" onclick="openVideo('${k}')">
      ${exIcon(k)}
      <div class="flex-1 min-w-0">
        <div class="font-medium text-slate-900 text-[15px]">${esc(ex.name)}${store.exercises[k] ? ' <span class="chip bg-slate-100 text-slate-500">custom</span>' : ''}</div>
        <div class="text-[12px] text-slate-500">${esc(ex.unit)} · steps of ${fmtNum(ex.step)}${ex.incline ? ' · incline' : ''} · in ${usedBy(k)} workout${usedBy(k) === 1 ? '' : 's'}</div>
      </div>
      ${exMedia(ex) ? `<img class="thumb" style="width:64px;height:42px" src="${esc(exMedia(ex))}" alt="">` : `<span class="thumb flex items-center justify-center text-slate-400" style="width:64px;height:42px">${I.video}</span>`}
    </button>`).join('');
  shell(`
    <header class="safe-top px-5 pb-3 pt-4 flex items-end justify-between">
      <div><button class="inline-flex items-center gap-1 text-slate-500 text-[14px] mb-1" onclick="history.back()">${I.back}Back</button><div class="text-[11px] uppercase tracking-widest text-slate-400 font-semibold">Creator tools</div><h1 class="text-[26px] font-bold text-slate-900">Exercise library</h1></div>
      <button class="btn btn-brand btn-sm" onclick="newExerciseSheet('')">${I.plus}New</button>
    </header>
    <div class="px-4 space-y-2 pb-8">${rows}
      <p class="text-[12px] text-slate-400 px-1 pt-2">Creator-side only — users never see this list. Every exercise has one demo video and an optional still. Custom ones live on this phone and travel with any workout you share.</p>
    </div>
  `, 'discover');
}

// ───────────────────────── beeps + vibration ─────────────────────────
let actx;
function beep(freq, dur) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur + 0.05);
  } catch {}
}
function vib(p) { try { navigator.vibrate?.(p); } catch {} }
// unlock audio on first touch (iOS)
document.addEventListener('touchstart', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }, { once: true, passive: true });

route();
// PWA: service worker for offline app shell
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
<script src="./cloud.js"></script>
</body>
