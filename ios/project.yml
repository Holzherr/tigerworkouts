name: TigerWorkouts
options:
  bundleIdPrefix: dev.brambruesch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: none
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Brambruesch paid team (Nicolas Holzherr-Mandal). Team IDs are public (they are in every signed binary).
    DEVELOPMENT_TEAM: 2JDH6Z4WZ8
    CODE_SIGN_STYLE: Automatic
    # Paid (default): HealthKit, the App Group the Up next widget reads, and Sign in with Apple.
    # Personal: HealthKit only, for a free team that cannot sign the other two.
    ENTITLEMENTS_KIND: Paid
targets:
  TigerWorkouts:
    type: application
    platform: iOS
    sources:
      - path: TigerWorkouts
        excludes: ["**/.DS_Store"]
    dependencies:
      - target: TigerWorkoutsWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brambruesch.tigerworkouts
        INFOPLIST_FILE: TigerWorkouts/Info.plist
        CODE_SIGN_ENTITLEMENTS: TigerWorkouts/TigerWorkouts-$(ENTITLEMENTS_KIND).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  TigerWorkoutsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TigerWorkoutsWidgets
      # The activity's shape, its buttons and the Up next snapshot are shared with the app rather
      # than duplicated.
      - path: TigerWorkouts/Shared/SessionActivity.swift
      - path: TigerWorkouts/Shared/SessionIntents.swift
      - path: TigerWorkouts/Shared/UpNextShare.swift
      - path: TigerWorkouts/Shared/UpNextWidgetView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brambruesch.tigerworkouts.widgets
        INFOPLIST_FILE: TigerWorkoutsWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TigerWorkoutsWidgets/TigerWorkoutsWidgets-$(ENTITLEMENTS_KIND).entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  TigerWorkoutsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TigerWorkoutsTests
      # The catalogue rides along so the decode test reads the real 470-odd workouts.
      - path: TigerWorkouts/Resources
        buildPhase: resources
    dependencies:
      - target: TigerWorkouts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brambruesch.tigerworkouts.tests
        GENERATE_INFOPLIST_FILE: YES

  TigerWorkoutsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TigerWorkoutsUITests]
    dependencies:
      - target: TigerWorkouts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brambruesch.tigerworkouts.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TigerWorkouts

schemes:
  TigerWorkouts:
    build:
      targets:
        TigerWorkouts: all
        TigerWorkoutsWidgets: all
        TigerWorkoutsTests: [test]
        TigerWorkoutsUITests: [test]
    test:
      targets: [TigerWorkoutsTests, TigerWorkoutsUITests]
