name: TigerWorkouts
options:
  bundleIdPrefix: com.holzherr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: none
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TigerWorkouts:
    type: application
    platform: iOS
    sources:
      - path: TigerWorkouts
        excludes: ["**/.DS_Store"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holzherr.tigerworkouts
        INFOPLIST_FILE: TigerWorkouts/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  TigerWorkoutsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TigerWorkoutsTests
      # The catalogue rides along so the decode test reads the real 470-odd workouts.
      - path: TigerWorkouts/Resources
        buildPhase: resources
    dependencies:
      - target: TigerWorkouts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holzherr.tigerworkouts.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TigerWorkouts:
    build:
      targets:
        TigerWorkouts: all
        TigerWorkoutsTests: [test]
    test:
      targets: [TigerWorkoutsTests]
